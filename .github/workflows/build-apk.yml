# Pure Barometer

Минималистичный офлайн-барометр для Android / Samsung Galaxy S25 Ultra.

## Что делает

- читает встроенный `Sensor.TYPE_PRESSURE`;
- показывает давление в мм рт. ст.;
- маленький виджет на рабочем столе;
- плитка быстрых настроек в шторке;
- нажатие на виджет или плитку делает новый замер;
- при `SCREEN_ON` делает один замер, пока процесс приложения находится в памяти;
- стрелка тренда: ↑ рост, ↓ падение, → без заметного изменения;
- интернет, GPS, аккаунт, реклама и аналитика не используются.

## Важно про SCREEN_ON

Современный Android не разрешает принимать `ACTION_SCREEN_ON` через receiver, объявленный в AndroidManifest. Поэтому приложение регистрирует receiver динамически. Если Android выгрузил процесс приложения из памяти, автоматический замер при следующем включении экрана не гарантируется. Ручное обновление виджетом/плиткой работает независимо от этого. Постоянная foreground-служба намеренно не используется, чтобы не держать уведомление и не расходовать батарею.

## GitHub Actions

1. Создайте репозиторий GitHub.
2. Загрузите содержимое этой папки в корень репозитория.
3. Откройте **Actions → Build APK → Run workflow**.
4. После сборки скачайте artifact **PureBarometer-debug**.
5. Внутри будет `app-debug.apk`.

## После установки

1. Один раз откройте приложение.
2. Нажмите **Добавить в шторку**.
3. Для виджета: удерживайте пустое место рабочего стола → **Виджеты → Барометр**.

